# 在 GitHub Actions 上建置 etag-relay 映像並推到 ghcr.io。
#
# 為什麼要這樣做(2026-07-27):Home Assistant 主機上的 docker build 會**卡住不動**——
# Supervisor 只印「Starting build」,之後既不報錯也不完成,連 job lock 都不放(導致
# add-on 無法更新/停止/移除,只能重開機)。而 HA 不提供 build 輸出,完全無從診斷。
# 改成雲端建置後:build 失敗看得到完整輸出,HA 端只剩單純 docker pull。
#
# config.yaml 的 `image:` 指向這裡推的映像,tag = config.yaml 的 version,
# 所以**每次改 etag-relay/ 都要記得 bump version**,否則 HA 端不會抓到新映像。
name: build etag-relay

on:
  push:
    branches: [main]
    paths:
      - 'etag-relay/**'
      - '!etag-relay/**.md'
      - '.github/workflows/build-etag-relay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 批K8(2026-08-23):build 前先跑測試——test-parse/test-inline 0.5.1 起已離線化
      # (合成 fixtures+stub fetch),但 CI 上從未執行過;測試紅=不建映像不推 ghcr。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install deps
        working-directory: etag-relay
        run: npm ci
      - name: relay tests
        working-directory: etag-relay
        run: node test-parse.js && node test-inline.js

      # 版本號以 config.yaml 為單一事實來源,避免兩處各寫一份而對不上
      - id: meta
        run: |
          VERSION=$(sed -n 's/^version: *"\(.*\)".*/\1/p' etag-relay/config.yaml)
          if [ -z "$VERSION" ]; then echo "找不到 config.yaml 的 version"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "建置版本:$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./etag-relay
          file: ./etag-relay/Dockerfile
          platforms: linux/amd64
          push: true
          # ⚠ 一定要關掉:buildx 預設會額外推一個 attestation manifest,讓 tag 變成
          # OCI image index(含一個 platform 為 unknown/unknown 的項目)。HA Supervisor
          # 在 pull 前會檢查映像架構,遇到這種 index 會在**印出任何 log 之前**就卡住
          # ——症狀就是「收到 install 請求後完全沒有下文、也沒有錯誤」。
          # 關掉後推的是單純的單一平台 manifest,與其他 HA add-on 映像一致。
          provenance: false
          sbom: false
          # HA add-on 的 image 設定會把 {arch} 換成 amd64,tag 用 config.yaml 的 version。
          # 同時推 latest 方便人工排查,HA 實際只會抓帶版號那個。
          tags: |
            ghcr.io/jiahaoliu322/etag-relay-amd64:${{ steps.meta.outputs.version }}
            ghcr.io/jiahaoliu322/etag-relay-amd64:latest
          # ⚠ 刻意不用 cache-from/cache-to: type=gha。首次建置掛了 47 分鐘還沒結束,
          # 對 playwright 這種 2.2GB 基礎映像做 mode=max 快取匯出,搬運量會多一倍以上、
          # 實測會拖到不可用。我們一個月才 build 幾次,省下的時間遠不及匯出的代價。
