# fetc-session-bridge 的測試(純函式模組 fetc-parse.js／fetc-chain.js 的 parity 等)。
# 0.8.0 起 etag-relay 已拆掉 lib/parse.js、lib/fetc-client.js、fixtures/:parity 改對擴充功能
# 自己的 golden(test/golden/relay-parity.json)與 test/fixtures,不再依賴 etag-relay。
name: test fetc-session-bridge

on:
  push:
    branches: [main]
    paths:
      - 'fetc-session-bridge/**'
      - '.github/workflows/test-session-bridge.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install fetc-session-bridge deps
        working-directory: fetc-session-bridge
        run: npm ci
      - name: test
        run: node --test fetc-session-bridge/test/*.test.js
