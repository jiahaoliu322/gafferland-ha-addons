name: "eTag Relay v3"
version: "0.4.0"
# 0.4.0(Round M,2026-07-30 使用者實測三症狀):
# **M0 真凶=驗證碼圖抓錯位置**(使用者:「驗證碼圖的位子跑掉,看不到真的驗證碼」)——原本用
#   元素區域截圖,遠通改版/元素被遮/版面位移就截到旁邊空白,顯示的不是真的那張碼 → 輸什麼
#   都被拒(先前歸因「v3 分數波動」至少部分是誤判)。改成把瀏覽器已載入的那張 img 畫進
#   canvas 取真實像素(與螢幕座標無關),多組候選選擇器+診斷 log/回應 header;刻意不重抓
#   img src(重抓會讓遠通換一組新碼、與使用者要對的那組脫鉤)。
# **M1 通知改每日一則**(裁示;原 2 小時):台北日期為基準,**日期落檔 session.json**→重啟
#   不重推同一天。manual-request 不受限。
# **M2 登入改 on-demand**:自動偵測失效不再開瀏覽器(只推通知)——凌晨開好的頁面等到中午
#   已過期、且瀏覽器整晚常駐把 Xvfb/x11vnc 拖垮。瀏覽器只在使用者開登入頁按「開始登入」時
#   才起;登入頁 /state 看到現有流程 >180 秒即自動重啟新流程;送出被拒/逾時自動換全新流程
#   (不在被 v3 記點的舊頁面上重試);MANUAL_LOGIN_TTL 15→8 分。
# **M3 輸碼 UX**:type=tel/20px(免 iOS 放大)/autofocus/滿 4 碼自動聚焦送出;submitCode 補
#   滑鼠軌跡與抖動延遲。
# **M4 VNC 可用性**:Xvfb 1440x900x24 → 1280x720x16、x11vnc -defer/-wait 20(手機流暢度);
#   進階區新增「把 4 碼打進遠端瀏覽器」(noVNC sendKey 合成按鍵,繞開手機 IME 在 VNC 打不出
#   數字的問題;登入鈕仍由真人親手按)。⚠ 螢幕尺寸與 lib/login.js --window-size 必須同步。
# 0.3.13
# 0.3.13:頁面輸碼失敗全數落日誌(遠通拒絕原話/timeout/達 3 次上限;不含帳密碼值)——使用者
# 回報「輸碼都失敗、開 VPN 才過」但日誌無任何線索;實為 reCAPTCHA 分數波動+每流程 3 次上限,
# 補日誌讓下次可直接對照。純診斷,不影響行為,不急著更新。
# 0.3.12:啟動即驗一次 session(使用者裁示)——原本只在「jar 全空」時觸發啟動登入,session
# 存在但已死(如遠通夜間砍 session 後重啟/更新 add-on)要空等 10 分鐘 keep-alive 首查;改為
# 啟動一律用 getAntiForgeryToken 真驗證:有效靜默記保溫,失效立即觸發登入流程。
# 0.3.11:登入通知冷卻 1 小時 → 2 小時(使用者裁示;session 失效期間 🔐 連結最短間隔)。
# 配套:Vercel 端 etag-captcha success 回呼新增「已過當日 06:50 排程即自動補跑 eTag 結算」。
# 0.3.10(Round J 緊急修):profile 快路徑「假成功」死循環——遠通 server 端砍 session 後,
# 死 FETC_P cookie 仍留在持久 profile,0.3.9 以前只驗 cookie 存在即宣告登入成功(不問遠通),
# 造成 keep-alive 每 10 分鐘偵測失效→觸發登入→假成功→LINE「✅ via profile」洗版,手動觸發
# 也被短路。改用與 keep-alive 同一把尺(getAntiForgeryToken)真驗證;失敗清 fetc 網域 cookie
# (保留 Google/_GRECAPTCHA v3 信譽 cookie)+重載首頁,走真人登入流程。
# 0.3.9(目標 19 收尾):純註解清理——E0/E1 時代「待活 session 驗證」TODO 全數改為已實測定案
# 註記(TOKEN_SOURCE_PATH/登入導回啟發式/resolveCin 車輛卡結構)。無任何功能變更,不需急著更新。
# 0.3.8(Round H1 終局):逆向列印頁 inline script 發現「下載PDF文件」真身=前端把列印頁
# DOM 打包 base64 POST 到遠通 /UX0000Common/UX000006GetPDF,**由遠通伺服器生成 PDF**
# (含電子憑證專用章/文字層)。/print 改純 HTTP 復刻同一打包(已用真 session 實測過
# application/pdf 回應),不再開瀏覽器;移除所有自家渲染 fallback(寧可沒 PDF 也不掛
# 非原生件上憑證欄);lib/print-pdf.js 移除。
# 0.3.7(Round H1 修正):使用者 DevTools 實查發現列印是**會員頁彈窗**不是獨立頁——
# 下載鈕 a.btn-download-pdf 屬會員頁骨架,0.3.6 表單導航拿到的裸片段上根本沒有按鈕。
# 改照遠通自己的流程:進會員頁→頁內 XHR(token 放 header)拿列印片段→塞進 #printDetail
# 彈窗→打開→按真正的下載鈕攔截 download;0.3.6 的導航+page.pdf() 降為 fallback。
# 0.3.6(Round H1):新端點 /print——中繼開 headless chromium 進遠通「真」列印頁(表單 POST
# 真站台,絕不 setContent 塞自家 HTML)、按遠通自己的「下載PDF文件」按鈕攔截 download,
# 取得有文字層、天然含 CJK 的原生 PDF(鐵則:PDF 是收款憑證,必須遠通自己生成——修正
# Vercel serverless chromium 渲染 printHtml 缺中文字型的問題);請求帶 times 子集,送進
# 遠通列印端點的 dateTimeJSON 從一開始就只含這個子集(修正混入租期外通行紀錄的問題);
# 找不到/點不到下載鈕降級 page.pdf()(via 標示區分兩種來源)。/query 加 skipPrint 旗標,
# 只要 transactions/total 時可省最後一次遠通 print 呼叫+2MB inline 資產。
# 0.3.5:登入頁改「驗證碼直接顯示+頁面輸碼」為主要路徑(使用者裁示;真 Chrome+持久
# profile 下實測代送能否過 v3),noVNC 遠端畫面收進同頁「進階」當備援;新端點
# /captcha.png、/code、/trigger(皆驗 key);修 0.3.4 拆過頭導致驗證碼圖沒載入的問題;
# noVNC 接上時自動換新驗證碼。
# 0.3.4(Round G1/G1b):徹底取消軌道 A(LINE 推 4 碼圖→自動送出,v3 一律判定機器人擋死)、
# Dockerfile 補裝真 Google Chrome(v3 指紋分數)、noVNC 入口拿掉 Cloudflare Access 改
# 「連結內建長亂數 token + VNC 密碼」兩層、無 session 自動觸發登入加 1 小時通知冷卻
# (避免 keep-alive 反覆開瀏覽器常駐 + LINE 洗版)、修 keep-alive 抱舊 jar closure 導致
# 保溫從未生效的根因(session 17 分鐘就失效)。
slug: "etag_relay_v3"
# ⚠ 2026-07-27 slug 由 etag_relay 改為 etag_relay_v2:HA Supervisor 有一筆昨晚 docker build
# 卡死的 docker_addon_install 工作(done:false)永久握著 addon_c90d9894_etag_relay 的工作群組鎖,
# 且寫進持久檔、重開機仍在,ha jobs reset 也清不掉(該指令只重置忽略條件)。新 slug＝新工作群組,
# 直接繞過。舊 slug 已無安裝,不會有埠號衝突。
# ⚠ 有 image: 就**不會**在 HA 上 build,Supervisor 只做 docker pull。
# 原因見 .github/workflows/build-etag-relay.yml 檔頭:HA 本機 build 會無聲卡死且無從診斷。
# {arch} 由 Supervisor 代換(本 add-on 只支援 amd64),tag 取自上方 version——
# **改 etag-relay/ 內容一定要同時 bump version**,否則 HA 抓不到新映像。
image: "ghcr.io/jiahaoliu322/etag-relay-{arch}"
description: "遠通(FETC)eTag 通行明細中繼服務,供 Gafferland Vercel cron-etag 呼叫(台灣住宅 IP 出口)"
arch:
  - amd64
init: false
ports:
  8099/tcp: 8099
  8098/tcp: 8098
ports_description:
  8099/tcp: "etag-relay HTTP API(建議只透過 Cloudflare Tunnel 對外,不直接開防火牆)"
  8098/tcp: "noVNC 遠端登入畫面(Round F;僅設 VNC_PASSWORD 才啟動,務必只透過 Cloudflare Tunnel 對外)"
map:
  - data:rw
options:
  FETC_ACCOUNT: ""
  FETC_PASSWORD: ""
  RELAY_SECRET: ""
  VERCEL_CAPTCHA_URL: ""
  VERCEL_CALLBACK_SECRET: ""
  PUBLIC_BASE_URL: ""
  VNC_PASSWORD: ""
  VNC_PUBLIC_URL: ""
  MANUAL_LOGIN_TTL_MIN: 15
schema:
  FETC_ACCOUNT: str
  FETC_PASSWORD: password
  RELAY_SECRET: password
  VERCEL_CAPTCHA_URL: str
  VERCEL_CALLBACK_SECRET: password
  PUBLIC_BASE_URL: str
  VNC_PASSWORD: password?
  VNC_PUBLIC_URL: str?
  MANUAL_LOGIN_TTL_MIN: int?
