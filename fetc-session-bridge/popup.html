<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Gafferland eTag Session</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    padding: 14px;
    background: #111214;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 13px;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 10px;
    color: #f5f5f5;
  }
  button {
    width: 100%;
    padding: 9px 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #23262b;
    line-height: 1.5;
  }
  .row .k { color: #9aa0a6; flex: none; }
  .row .v { text-align: right; word-break: break-all; }
  .row .v.ok { color: #4ade80; }
  .row .v.no { color: #f5c451; }
  .row .v.bad { color: #f87171; }
  #receiptHint {
    display: none;
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: rgba(245, 196, 81, 0.12);
    border: 1px solid rgba(245, 196, 81, 0.4);
    color: #f5c451;
    line-height: 1.5;
  }
  #runBtn {
    background: #3b82f6;
    color: #fff;
  }
  #runBtn:disabled {
    background: #2a3d5c;
    color: #9aa0a6;
    cursor: not-allowed;
  }
  #runBtn:hover:not(:disabled) {
    background: #2f6fe0;
  }
  #runNote {
    color: #9aa0a6;
    font-size: 11px;
    line-height: 1.5;
    margin: 6px 0 0;
  }
  #openFetcBtn, #openSettingsBtn, #openReceiptsBtn {
    background: #2a2d33;
    color: #e6e6e6;
    border: 1px solid #3a3d45;
  }
  .footer {
    margin-top: 12px;
    text-align: right;
  }
  .footer a {
    color: #9aa0a6;
    font-size: 11px;
    text-decoration: none;
  }
  .footer a:hover {
    color: #cfd2d6;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>Gafferland eTag Session</h1>

  <div id="agentRows">
    <div class="row"><span class="k">這台電腦</span><span class="v" id="agentVal">讀取中…</span></div>
    <div class="row"><span class="k">遠通</span><span class="v" id="fetcVal">讀取中…</span></div>
    <div class="row"><span class="k">站台待處理</span><span class="v" id="queueVal">讀取中…</span></div>
    <div class="row"><span class="k">上次執行</span><span class="v" id="lastRunVal">讀取中…</span></div>
    <div class="row" id="lastErrRow" style="display:none;"><span class="k">最後錯誤</span><span class="v" id="lastErrVal"></span></div>
  </div>
  <div id="receiptHint"><div id="receiptHintText"></div><button id="openReceiptsBtn">開啟匯入頁</button></div>

  <button id="runBtn" disabled>執行</button>
  <p id="runNote"></p>
  <button id="openSettingsBtn" style="display:none;">開啟設定</button>
  <button id="openFetcBtn" style="display:none;">開啟遠通會員區</button>

  <div class="footer"><a href="#" id="optionsLink">設定</a></div>

  <script src="agent-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
