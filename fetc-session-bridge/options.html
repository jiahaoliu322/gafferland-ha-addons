<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Gafferland eTag Session — 設定</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    background: #111214;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 13px;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
    color: #f5f5f5;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #9aa0a6;
  }
  input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #2a2d33;
    background: #1c1e22;
    color: #e6e6e6;
    font-size: 13px;
    margin-bottom: 10px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: #2f6fe0;
  }
  #saved {
    display: none;
    margin-left: 10px;
    color: #4ade80;
  }
</style>
</head>
<body>
  <h1>Gafferland eTag Session — 設定</h1>

  <label for="baseUrl">站台 Base URL</label>
  <input type="text" id="baseUrl" placeholder="https://gafferland.vercel.app" />

  <button id="saveBtn">儲存</button>
  <span id="saved">已儲存 ✓</span>

  <script src="options.js"></script>
</body>
</html>
