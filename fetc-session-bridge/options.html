<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Gafferland eTag Session — 設定</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    background: #111214;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 13px;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
    color: #f5f5f5;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #9aa0a6;
  }
  input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #2a2d33;
    background: #1c1e22;
    color: #e6e6e6;
    font-size: 13px;
    margin-bottom: 10px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: #3b82f6;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: #2f6fe0;
  }
  #saved {
    display: none;
    margin-left: 10px;
    color: #4ade80;
  }
  h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 20px 0 8px;
    padding-top: 14px;
    border-top: 1px solid #2a2d33;
    color: #f5f5f5;
  }
  .hint {
    color: #9aa0a6;
    font-size: 11px;
    line-height: 1.5;
    margin: 0 0 8px;
  }
  .msg {
    display: none;
    margin-top: 8px;
    line-height: 1.5;
  }
  .msg.show { display: block; }
  .msg.error { color: #f87171; }
  .msg.ok { color: #4ade80; }
  button.secondary {
    background: #2a2d33;
    color: #e6e6e6;
    border: 1px solid #3a3d45;
  }
  button.secondary:hover { background: #33363d; }
  #pairBtn:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>Gafferland eTag Session — 設定</h1>

  <label for="baseUrl">站台 Base URL</label>
  <input type="text" id="baseUrl" placeholder="https://admin.gafferland.com" />

  <button id="saveBtn">儲存</button>
  <span id="saved">已儲存 ✓</span>

  <span class="msg" id="urlMsg"></span>

  <h2>這台電腦</h2>
  <div id="unpairedBox">
    <p class="hint">到後台 /collect 的「eTag 電腦」區按「新增電腦」,取得 8 碼配對碼(10 分鐘內有效),貼在這裡。</p>
    <label for="pairCode">配對碼</label>
    <input type="text" id="pairCode" maxlength="8" autocomplete="off" placeholder="例:K7M2Q9XA" />
    <button id="pairBtn">配對</button>
  </div>
  <div id="pairedBox" style="display:none;">
    <div id="pairedName"></div>
    <p class="hint">解除配對只清除這台的本機設定;請同時到 /collect 把這台電腦移除。</p>
    <button id="unpairBtn" class="secondary">解除配對</button>
  </div>
  <span class="msg" id="pairMsg"></span>

  <script src="agent-core.js"></script>
  <script src="options.js"></script>
</body>
</html>
